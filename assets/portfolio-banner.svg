<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Sachin Kumar — Full-stack developer</title>
  <desc id="desc">A midnight developer portfolio banner with a stylized person coding at a laptop, floating interface panels, a blinking code caret, and gently animated typing hands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111b32"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#77f2c3" stop-opacity="0"/>
      <stop offset=".45" stop-color="#77f2c3" stop-opacity=".95"/>
      <stop offset="1" stop-color="#7895ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#77f2c3" stop-opacity=".2"/>
      <stop offset="1" stop-color="#77f2c3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#a8b6d7" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <style>
    .mobile { display: none; }
    @media (max-width: 560px) {
      .desktop { display: none; }
      .mobile { display: inline; }
      .mobile-detail { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { display: none; }
    }
  </style>
  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="24" fill="url(#grid)"/>
  <ellipse cx="970" cy="200" rx="280" ry="220" fill="url(#glow)" filter="url(#soft)"/>
  <path d="M0 390H1200" stroke="#b7c5e8" stroke-opacity=".12"/>

  <g class="desktop">
    <circle cx="48" cy="43" r="5" fill="#ff7b72"/>
    <circle cx="68" cy="43" r="5" fill="#f6c76b"/>
    <circle cx="88" cy="43" r="5" fill="#77f2c3"/>
    <text x="116" y="48" fill="#9caac8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="1.5">SACHIN-KUMAR / PORTFOLIO</text>
    <text x="68" y="153" fill="#f5f7fb" font-family="Inter, Segoe UI, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Building useful things.</text>
    <text x="70" y="203" fill="#a8b6d7" font-family="Inter, Segoe UI, sans-serif" font-size="22">Full-stack development, from polished interfaces to reliable systems.</text>
    <text x="70" y="270" fill="#77f2c3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">&gt; make_it_clear()  ·  make_it_work()  ·  make_it_last()</text>
    <rect x="535" y="255" width="9" height="22" rx="2" fill="#77f2c3">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.38;.48;.9;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <path d="M70 328H765" stroke="#9eacd0" stroke-opacity=".15" stroke-width="2" stroke-linecap="round"/>
    <path d="M70 328H330" stroke="url(#flow)" stroke-width="2" stroke-dasharray="85 650" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="700" to="0" dur="7s" repeatCount="indefinite"/>
    </path>
    <text x="70" y="357" fill="#7182aa" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">// curiosity, then a clear path from idea to implementation</text>
  </g>

  <!-- Workstation scene: all geometry is local to this translated group. -->
  <g transform="translate(770 65)">
    <!-- Floating interface panels -->
    <g class="mobile-detail">
      <rect x="8" y="18" width="132" height="76" rx="9" fill="#121d34" stroke="#8294bd" stroke-opacity=".35"/>
      <path d="M8 39H140" stroke="#8294bd" stroke-opacity=".22"/>
      <circle cx="22" cy="29" r="2.5" fill="#ff7b72"/>
      <circle cx="31" cy="29" r="2.5" fill="#f6c76b"/>
      <circle cx="40" cy="29" r="2.5" fill="#77f2c3"/>
      <path d="M22 51h32M22 61h72M22 71h50M22 81h85" stroke="#a8b6d7" stroke-opacity=".42" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 51h18M22 71h28" stroke="#77f2c3" stroke-opacity=".9" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="mobile-detail">
      <rect x="281" y="65" width="118" height="63" rx="9" fill="#121d34" stroke="#8294bd" stroke-opacity=".35"/>
      <circle cx="297" cy="84" r="5" fill="#77f2c3" fill-opacity=".25" stroke="#77f2c3" stroke-opacity=".8">
        <animate attributeName="fill-opacity" values=".2;.65;.2" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <path d="M310 82h70M295 101h80M295 114h48" stroke="#a8b6d7" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
    </g>
    <ellipse cx="234" cy="178" rx="196" ry="149" fill="url(#glow)" opacity=".6"/>

    <!-- Chair and desk -->
    <path class="mobile-detail" d="M251 151q-9-26 2-40q13-14 45-10q26 4 30 27v86h-26v-39q-22-20-51-24z" fill="#1b2947" stroke="#7487b0" stroke-opacity=".4" stroke-width="2"/>
    <path d="M32 258H406" stroke="#7895ff" stroke-opacity=".75" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 262v88M389 262v88M34 351h30M374 351h30" fill="none" stroke="#7182aa" stroke-opacity=".65" stroke-width="4" stroke-linecap="round"/>

    <!-- Laptop display behind the developer's hands -->
    <path d="M73 147q0-8 9-8h152q9 0 9 8v94H73z" fill="#111a2d" stroke="#a8b6d7" stroke-opacity=".58" stroke-width="3"/>
    <rect x="83" y="149" width="150" height="77" rx="3" fill="#0b1020"/>
    <path d="M96 163h28M96 173h61M96 183h42M108 193h74M108 203h48" stroke="#a8b6d7" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>
    <path d="M96 163h15M96 183h20M108 203h19" stroke="#77f2c3" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
    <rect x="128" y="198" width="4" height="9" rx="1" fill="#77f2c3">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.4;.5;.9;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <path d="M65 246h188l18 11H47z" fill="#263550" stroke="#a8b6d7" stroke-opacity=".5" stroke-width="2"/>
    <path d="M86 249h145M99 253h118" stroke="#a8b6d7" stroke-opacity=".28" stroke-width="1.5"/>
    <rect x="266" y="246" width="79" height="11" rx="4" fill="#263550" stroke="#a8b6d7" stroke-opacity=".48"/>
    <path d="M275 250h4M284 250h4M293 250h4M302 250h4M311 250h4M320 250h4M329 250h4" stroke="#a8b6d7" stroke-opacity=".48" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Upper body, head, and hair -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="4.8s" repeatCount="indefinite"/>
      <path d="M204 163q13-27 42-32h56q33 10 40 44l-8 78H203z" fill="#416a9c" stroke="#7895ff" stroke-opacity=".55" stroke-width="2"/>
      <path d="M246 136v24M292 136v24" stroke="#e3ad83" stroke-width="18" stroke-linecap="round"/>
      <path d="M228 67q0-34 33-39q38-4 48 28q6 24-7 47q-12 18-33 17q-23-1-34-22q-7-14-7-31z" fill="#e8b58d"/>
      <path d="M227 79q-11-29 7-47q14-18 40-16q31 1 43 25q5 12 0 28q-6-11-13-19q-23 10-58 4q-5 13-19 25z" fill="#18243a"/>
      <path d="M236 80q4 8 10 2M279 82q5 6 10 0" fill="none" stroke="#34435a" stroke-width="3" stroke-linecap="round"/>
      <path d="M256 98q10 6 20 0" fill="none" stroke="#9d5c53" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="223" cy="82" r="7" fill="#e8b58d"/>
      <path d="M214 153q-16 21-22 50l-13 35q-4 10 5 14q9 4 14-7l24-42 21-30" fill="#416a9c" stroke="#7895ff" stroke-opacity=".5" stroke-width="2"/>
      <path d="M195 231q-11 12-13 24q-1 7 6 8q6 1 10-6l9-16" fill="none" stroke="#e8b58d" stroke-width="9" stroke-linecap="round"/>
      <path d="M328 155q18 18 24 47l9 35q3 11-6 14q-9 3-13-8l-20-44-18-27" fill="#416a9c" stroke="#7895ff" stroke-opacity=".5" stroke-width="2"/>
      <path d="M348 231q10 12 12 24q1 7-6 8q-7 1-10-6l-9-16" fill="none" stroke="#e8b58d" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- Typing hands and small mouse -->
    <g fill="#e8b58d" stroke="#cc9877" stroke-width="1.5">
      <path d="M184 251q6-7 13-4l12 4q5 2 3 7q-1 4-6 3l-9-2q10 4 7 8q-2 4-7 1l-10-5q-7-4-3-12z">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur=".72s" repeatCount="indefinite"/>
      </path>
      <path d="M334 250q-6-6-12-3l-12 4q-5 2-3 7q2 4 7 2l8-3q-9 5-5 9q3 3 8 0l9-6q6-5 0-10z">
        <animateTransform attributeName="transform" type="translate" values="0 -2;0 1;0 -2" dur=".86s" repeatCount="indefinite"/>
      </path>
    </g>
    <path class="mobile-detail" d="M380 248q11 0 11 9v3q0 9-11 9t-11-9v-3q0-9 11-9z" fill="#263550" stroke="#a8b6d7" stroke-opacity=".5"/>
  </g>

  <g class="mobile">
    <text x="56" y="143" fill="#f5f7fb" font-family="Inter, Segoe UI, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Building useful</text>
    <text x="56" y="210" fill="#f5f7fb" font-family="Inter, Segoe UI, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">things.</text>
    <text x="58" y="270" fill="#a8b6d7" font-family="Inter, Segoe UI, sans-serif" font-size="40">Full-stack · Systems</text>
    <text x="58" y="326" fill="#77f2c3" font-family="Inter, Segoe UI, sans-serif" font-size="38">Thoughtful by design.</text>
    <rect x="502" y="310" width="8" height="23" rx="2" fill="#77f2c3">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.38;.48;.9;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="1198" height="438" rx="23" fill="none" stroke="#dbe5ff" stroke-opacity=".12"/>
</svg>

